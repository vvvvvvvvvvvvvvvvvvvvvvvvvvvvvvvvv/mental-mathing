name: Deploy Web App

on:
  push:
    branches: [claude/mental-mathing-app-01RbRmQ1FdH3kUXrb6b8yuy7, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./mental-mathing-app
        run: npm install

      - name: Build web
        working-directory: ./mental-mathing-app
        run: npx expo export:web
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mental-mathing-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
